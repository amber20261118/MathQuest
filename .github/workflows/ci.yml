name: CI for MemeMathQuest

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Test on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment & Swift Version
        run: |
          xcodebuild -version
          swift --version
