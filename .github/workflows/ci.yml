name: CI for MemeMathQuest

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Test on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Environment & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Typecheck Swift Code for iOS/iPadOS
        run: |
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swiftc -typecheck -sdk "$SDK_PATH" -target arm64-apple-ios17.0-simulator *.swift
