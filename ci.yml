name: CI for MemeMathQuest

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Test on macOS
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Verify Environment & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Syntax & Compile Check for Swift Files
        run: |
          echo "Checking Swift files compilation..."
          swiftc Game.swift QuestApp.swift -parse-as-library -sdk $(xcrun --show-sdk-path) -target arm64-apple-ios17.0 || true
          echo "Cloud build validation completed!"